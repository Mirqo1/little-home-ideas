name: Validate magazine
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
      - run: npm run check:site
      - run: node scripts/export-pages.mjs
      - run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: little-home-ideas-static-site
          path: dist/
          include-hidden-files: true
      - name: Temporary paint sample visual review
        run: |
          python3 -m http.server 8765 --directory dist &
          mkdir -p /tmp/article-review
          google-chrome --headless --no-sandbox --disable-dev-shm-usage --hide-scrollbars --virtual-time-budget=4000 --screenshot=/tmp/article-review/desktop.png --window-size=1365,11000 http://127.0.0.1:8765/articles/test-paint-colors-small-room/
          google-chrome --headless --no-sandbox --disable-dev-shm-usage --hide-scrollbars --virtual-time-budget=4000 --screenshot=/tmp/article-review/mobile.png --window-size=390,18000 http://127.0.0.1:8765/articles/test-paint-colors-small-room/
      - uses: actions/upload-artifact@v4
        with:
          name: paint-samples-visual-review
          path: /tmp/article-review/
