name: Validate magazine
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
      - run: npm run check:site
      - run: node scripts/export-pages.mjs
      - run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: little-home-ideas-static-site
          path: dist/
          include-hidden-files: true
