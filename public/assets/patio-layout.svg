<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="t d"><title id="t">Targeted patio privacy layout</title><desc id="d">Overhead garden plan with a short screen, seating around a round table, potted plants, and a clear path.</desc><defs><pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="3" cy="4" r=".7" fill="#27382e" opacity=".06"/></pattern></defs><rect width="960" height="640" fill="#f3f1df"/><rect width="960" height="640" fill="url(#grain)"/><rect x="138" y="130" width="684" height="379" rx="44" fill="#ded8bc"/><path d="M151 417q300-15 650 5" stroke="#f9f7e8" stroke-width="75" fill="none"/><rect x="180" y="163" width="28" height="204" rx="7" fill="#b18f64"/><circle cx="267" cy="194" r="31" fill="#66866b"/><circle cx="263" cy="297" r="44" fill="#869b72"/><circle cx="470" cy="283" r="67" fill="#cfa982"/><circle cx="470" cy="283" r="54" fill="none" stroke="#af8d67" stroke-width="3"/><rect x="407" y="163" width="122" height="48" rx="17" fill="#fffdf4"/><rect x="401" y="361" width="135" height="45" rx="17" fill="#fffdf4"/><circle cx="715" cy="203" r="44" fill="#85946e"/><circle cx="732" cy="315" r="24" fill="#b99a62"/><path d="M298 443h419m-20-13 20 13-20 13" stroke="#63775c" stroke-width="4" fill="none"/><text x="150" y="87" fill="#435d43" font-family="Arial,sans-serif" font-size="28" text-anchor="start">Screen the seat, not the whole patio</text><text x="303" y="559" fill="#435d43" font-family="Arial,sans-serif" font-size="22" text-anchor="start">A clear path makes a small patio work.</text></svg>