<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="t d"><title id="t">Removable hook planning checklist</title><desc id="d">Three-part technical illustration showing surface, load, and product-specific removal checks.</desc><defs><pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="3" cy="4" r=".7" fill="#27382e" opacity=".06"/></pattern></defs><rect width="960" height="640" fill="#eef4f8"/><rect width="960" height="640" fill="url(#grain)"/><rect x="95" y="180" width="240" height="303" rx="18" fill="#fff" stroke="#bed0dc" stroke-width="2"/><circle cx="129" cy="218" r="19" fill="#42647b"/><text x="129" y="224" fill="#fff" font-family="Arial,sans-serif" font-size="19" text-anchor="middle">1</text><text x="115" y="452" fill="#2d5067" font-family="Arial,sans-serif" font-size="20" text-anchor="start">Check the wall</text><rect x="360" y="180" width="240" height="303" rx="18" fill="#fff" stroke="#bed0dc" stroke-width="2"/><circle cx="394" cy="218" r="19" fill="#42647b"/><text x="394" y="224" fill="#fff" font-family="Arial,sans-serif" font-size="19" text-anchor="middle">2</text><text x="380" y="452" fill="#2d5067" font-family="Arial,sans-serif" font-size="20" text-anchor="start">Check the load</text><rect x="625" y="180" width="240" height="303" rx="18" fill="#fff" stroke="#bed0dc" stroke-width="2"/><circle cx="659" cy="218" r="19" fill="#42647b"/><text x="659" y="224" fill="#fff" font-family="Arial,sans-serif" font-size="19" text-anchor="middle">3</text><text x="645" y="452" fill="#2d5067" font-family="Arial,sans-serif" font-size="20" text-anchor="start">Plan removal</text><path d="M130 288h170m-170 42h170m-170 42h170" stroke="#bdd0db" stroke-width="8"/><rect x="155" y="267" width="42" height="107" rx="7" fill="#83a3b2"/><path d="M439 285v63q34 35 57 0" stroke="#83a3b2" stroke-width="12" fill="none"/><path d="M415 359h101l-10 40h-82z" fill="#d7bc84"/><rect x="713" y="260" width="63" height="95" rx="12" fill="#83a3b2"/><rect x="737" y="359" width="15" height="22" fill="#d7bc84"/><path d="M744 382v36m-14-16 14 16 14-16" stroke="#42647b" stroke-width="5" fill="none"/><text x="95" y="95" fill="#2d5067" font-family="Arial,sans-serif" font-size="27" text-anchor="start">A removable hook is a system, not a shortcut.</text><text x="95" y="549" fill="#2d5067" font-family="Arial,sans-serif" font-size="22" text-anchor="start">Follow the instructions for the exact product.</text></svg>